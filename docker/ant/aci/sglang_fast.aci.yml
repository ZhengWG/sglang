# 这个文件用来备份记录仓库工程配置中的流水线模版
# https://linkex.alipay.com/project/161500101/template?tenant_path=alipay&current=1&star=false&templateTab=edit&templateId=174800029

version: "2.0"
stages:
  - Build-Image
  - STC-Scan
  - Image-Scan
  - Push-Image

triggers:
  git:
    push:
      branches:
        - ^master$
    tagPush:
      tags:
        - ".*"
    pullRequest:
      targetBranches:
        - "^master$"

parameters:
  sglang_kernel_whl_url: ""
  sglang_whl_url: ""
  runtime_base_image:  "reg.docker.alibaba-inc.com/sglang/deepep-base" # 之前已经制作好的sglang runtime镜像，请确保这个镜像中安装的sglang和sglang-kernel版本的依赖，比如cuda，torch等和上面填写的whl包兼容，否则可能会出现运行时不兼容的问题
  runtime_base_image_tag: "1ef14f05-20260529110432" # 这个是已经制作好的runtime镜像，基于commit 1ef14f05

jobs:
  构建sglang镜像:
    stage: Build-Image
    component: docker-image-build
    id: build-image
    inputs:
      imageName: reg.docker.alibaba-inc.com/sglang/deepep-base # 构建产物镜像名称(不含tag), 如: reg.docker.alibaba-inc.com/antcodebuild/test-image-build
      imageTag: ${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}} # 构建产物镜像 tag
      dockerfile: ./Dockerfile.fast # dockerfile 路径，不传默认为 ./Dockerfile (即: ${ACB_BUILD_DIR}/code-repo/Dockerfile)
      contextDir: ./ # docker build 的 context 目录，不传默认为 ./ (即: ${ACB_BUILD_DIR}/code-repo 目录)
      buildArgs: SGLANG_BUILD_URL=${{pipeline.url}},RUNTIME_BASE_IMAGE=${{parameters.runtime_base_image}},RUNTIME_BASE_IMAGE_TAG=${{parameters.runtime_base_image_tag}},SGLANG_KERNEL_WHL_URL=${{parameters.sglang_kernel_whl_url}},SGLANG_WHL_URL=${{parameters.sglang_whl_url}}
      compression: uncompressed # 为新创建和缓存的镜像层选择压缩类型，默认值为未压缩uncompressed
      forceCompression: false # 对所有镜像层强制应用压缩类型compression(包括已经存在的层)
      registryUsername: null # 镜像 registry 用户名，建议使用 aci secrets 方式传递，避免泄露 (reg.docker.alibaba-inc.com、acs-reg.alipay.com 不传时默认使用平台公共账号 admin.for.antb)
      registryPassword: null # 镜像 registry 密码，建议使用 aci secrets 方式传递，避免泄露 (不传使用平台公共账号)
      skipWhenImageExists: null # true | false, 如果镜像已存在，是否跳过镜像构建，默认 false
      errWhenImageExists: null # true | false, 如果镜像已存在，是否直接失败，默认 true
      beforeScript: |
        cat <<'EOF' > ./Dockerfile.fast
        ARG RUNTIME_BASE_IMAGE
        ARG RUNTIME_BASE_IMAGE_TAG

        FROM ${RUNTIME_BASE_IMAGE}:${RUNTIME_BASE_IMAGE_TAG}

        ARG SGLANG_WHL_URL
        ARG SGLANG_KERNEL_WHL_URL
        ARG SGLANG_BUILD_URL

        RUN if [ -f /etc/ssl/certs/ca-bundle.crt ]; then \
                cp /etc/ssl/certs/ca-bundle.crt /tmp/ca-bundle.crt; \
                cat /etc/ssl/certs/ca-certificates.crt /tmp/ca-bundle.crt > /etc/ssl/certs/ca-bundle.crt; \
                rm /tmp/ca-bundle.crt; \
            else \
                cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-bundle.crt; \
            fi
        # 安装蚂蚁内部的decord2, 社区的解码会夯死
        ARG DECORD2_WHL_URL='http://dmsint.cn-hangzhou.alipay.aliyun-inc.com/noao/yuhong.gyh/decord2_fix/decord2-2.1.0-cp312-cp312-manylinux_2_28_x86_64.whl'
        RUN pip3 uninstall -y decord2; pip3 install --force-reinstall --no-cache-dir ${DECORD2_WHL_URL}
        RUN pip3 install --force-reinstall --no-cache-dir numpy==1.26.4

        RUN apt-get update && apt-get install -y jq ffmpeg && rm -rf /var/lib/apt/lists/* && apt-get clean
        RUN pip install scipy==1.15.3 distro cryptography modelscope aistudio-modelhub pillow-heif --no-cache-dir

        RUN wget "https://gosspublic.alicdn.com/ossutil/v2/2.1.1/ossutil-2.1.1-linux-amd64.zip" && \
            unzip -o ossutil-2.1.1-linux-amd64.zip -d /usr/local/ && \
            chmod +x /usr/local/ossutil-2.1.1-linux-amd64/ossutil && \
            ln -sf /usr/local/ossutil-2.1.1-linux-amd64/ossutil /usr/local/bin/ossutil && \
            rm -vf ossutil-2.1.1-linux-amd64.zip

        RUN if [ -n "${SGLANG_WHL_URL}" ]; then \
            pip install --force-reinstall --no-deps "sglang @ ${SGLANG_WHL_URL}" --extra-index-url https://download.pytorch.org/whl/cu130;  \
        fi
        RUN if [ -n "${SGLANG_KERNEL_WHL_URL}" ]; then \
            pip install --force-reinstall --no-deps "sglang-kernel @ ${SGLANG_KERNEL_WHL_URL}"; \
        fi

        ENV SGLANG_BUILD_URL=${SGLANG_BUILD_URL:-}
        LABEL ai.sglang.build.url="${SGLANG_BUILD_URL}"
        EOF
        cat ./Dockerfile.fast
      beforeScriptImage: null  # 指定前置脚本运行环境镜像，beforeScript 不为空时需要传值(不传使用默认基础alios镜像)
      afterScript: null # 后置脚本，按需传递 (在 ${ACB_BUILD_DIR}/code-repo 下执行)
      afterScriptImage: null  # 指定后置脚本运行环境镜像，afterScript 不为空时需要传值(不传使用默认基础alios镜像)
      nydusSwitch: true # 是否一并构建 nydus 加速镜像，true | false，默认为 true。详细信息：https://yuque.antfin-inc.com/tuna/nydus/pmlc56l8svt95ilh#i7Q1f
      nydusPreheat: "" # 在哪些集群预热 nydus 加速镜像，通常只有国际集群才需要预热，默认不设置。详细信息：https://yuque.antfin-inc.com/tuna/nydus/ud4aiwfegqpu9qbd#SutsQ
      cacheStrategy: always # 镜像构建是否使用缓存，默认 always
      target: "${{parameters.image_build_target}}" # Set the target build stage to build，extraTags中同样可以设置target，优先级参考下方文档描述
      extraTags: null # 可指定多个 (当前最多支持5个) 额外的构建镜像Tag, 格式参考下方文档描述 (如需推送到其他镜像中心，还需要配置对应的账密)
      scriptCaches: null # 自定义缓存
      timeoutInSec: 7200 # 构建任务执行超时时间，单位(秒)
      strictLabel: largeResource # 使用性能更好的机器
  STC:
    stage: STC-Scan
    id: sct-scan
    component: stc
    inputs:
      appName: sglang
      image: reg.docker.alibaba-inc.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      projectType: AIDC
  镜像扫描:
    stage: Image-Scan
    id: image-scan-core
    component: image-scan
    inputs:
      appName: sglang
      image: reg.docker.alibaba-inc.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      tenant: AIDC # 或者其他，比如 AIDC，这个必须要和镜像同步组件的租户一致

  推送sglang镜像[S集群]:
    stage: Push-Image
    component: image-sync-from-alipay-to-ats
    id: push-image
    inputs:
      checkImageAndStc: false
      sourceImage: reg.docker.alibaba-inc.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      targetImage: acr-sh-ant-registry-vpc.cn-shanghai.cr.aliyuncs.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      appName: sglang
      tenant: AIDC # 或者其他，比如 AIDC，这个必须要和镜像扫描组件的租户一致
      retry: 10
      imageType: oci

  推送sglang镜像[北京B1]:
    stage: Push-Image
    component: image-sync-from-alipay-to-ats
    id: push-image
    inputs:
      checkImageAndStc: false
      sourceImage: reg.docker.alibaba-inc.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      targetImage: acr-bj-ant-registry-vpc.cn-beijing.cr.aliyuncs.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      appName: sglang
      tenant: AIDC # 或者其他，比如 AIDC，这个必须要和镜像扫描组件的租户一致
      retry: 10
      imageType: oci

  推送镜像信息至keeper:
    stage: Push-Image
    component: push-image-to-keeper
    id: push-image-to-keeper
    inputs:
      mainSiteImage: reg.docker.alibaba-inc.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
      aidcSiteImage: acr-sh-ant-registry-vpc.cn-shanghai.cr.aliyuncs.com/sglang/deepep-base:${{vcs.commitShortSha}}-${{pipeline.currentTimestamp}}
